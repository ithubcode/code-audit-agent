<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="240" rx="16" fill="url(#bg)"/>
  <rect x="40" y="40" width="720" height="4" rx="2" fill="url(#accent)"/>

  <!-- Magnifying glass icon -->
  <circle cx="140" cy="110" r="35" fill="none" stroke="#3b82f6" stroke-width="4"/>
  <line x1="165" y1="135" x2="185" y2="155" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="135" x2="185" y2="155" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"/>

  <!-- Code brackets -->
  <text x="200" y="100" font-family="monospace" font-size="18" fill="#64748b">&lt;</text>
  <text x="210" y="100" font-family="monospace" font-size="18" fill="#3b82f6">/</text>
  <text x="220" y="100" font-family="monospace" font-size="18" fill="#64748b">&gt;</text>

  <!-- Title -->
  <text x="200" y="130" font-family="monospace" font-size="32" font-weight="bold" fill="#ffffff">code-audit-agent</text>

  <!-- Tagline -->
  <text x="200" y="160" font-family="sans-serif" font-size="15" fill="#94a3b8">
    Code Quality Auditing Agent
  </text>
  <text x="200" y="180" font-family="sans-serif" font-size="13" fill="#64748b">
    14 categories · 6 languages · SARIF · Incremental
  </text>

  <!-- Status badges -->
  <rect x="500" y="95" width="90" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="511" y="112" font-family="sans-serif" font-size="12" fill="#60a5fa">Powered by AI</text>

  <rect x="500" y="128" width="90" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="525" y="145" font-family="sans-serif" font-size="12" fill="#94a3b8">v0.1.0</text>

  <!-- Bottom accent bar -->
  <rect x="40" y="196" width="720" height="1" rx="0.5" fill="#1e293b"/>

  <!-- by ITHub -->
  <text x="400" y="220" font-family="sans-serif" font-size="12" fill="#475569" text-anchor="middle">by ITHub</text>
</svg>
